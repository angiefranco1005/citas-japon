name: Vigilar citas Embajada Japón

on:
  schedule:
    # Corre cada 15 minutos, 24/7
    - cron: "*/7 * * * *"
  workflow_dispatch: {}   # permite correrlo manualmente desde GitHub también

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar calendario y avisar si hay cupo
        env:
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
        run: python check_citas.py
